<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문서 · 마켓프레시</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="site">
    <div class="header-row">
      <a class="logo" href="/" data-testid="logo">마켓프레시</a>
      <input class="search" id="site-search" data-testid="search"
             placeholder="검색어를 입력해주세요" aria-label="상품 검색" />
      <span class="auth" id="auth-area" data-testid="auth-area"></span>
      <a class="cart-link" href="/cart" data-testid="cart-link" aria-label="장바구니">
        🛒<span class="cart-count hidden" id="cart-count" data-testid="cart-count">0</span>
      </a>
    </div>
    <nav class="cats" id="cat-nav" data-testid="cat-nav" aria-label="카테고리"></nav>
  </header>

  <main>
    <h1 class="order-title">주문서</h1>

    <div class="loading" id="loading" data-testid="loading">
      <span class="spinner" aria-hidden="true"></span> 불러오는 중…
    </div>

    <div class="empty hidden" id="empty" data-testid="order-empty">
      <p>주문할 상품이 없습니다.</p>
      <a class="btn btn-outline" href="/" style="display:inline-block;margin-top:1rem">쇼핑하러 가기</a>
    </div>

    <div id="order-body" class="order-layout hidden" data-testid="order-body">
      <div class="order-main">
        <!-- 주문자 정보 -->
        <section class="order-card">
          <h2 class="order-card-title">주문자 정보</h2>

          <!-- 로그인: 텍스트 표시 -->
          <div class="info-view hidden" id="orderer-view" data-testid="orderer-view">
            <div class="info-name" id="view-orderer-name" data-testid="view-orderer-name"></div>
            <div class="info-line" id="view-orderer-phone" data-testid="view-orderer-phone"></div>
            <div class="info-line" id="view-orderer-email" data-testid="view-orderer-email"></div>
          </div>

          <!-- 비로그인: 입력 폼 -->
          <div class="info-form" id="orderer-form" data-testid="orderer-form">
            <div class="field">
              <label for="orderer-name">이름</label>
              <input type="text" id="orderer-name" data-testid="orderer-name" autocomplete="name" />
              <p class="error" id="orderer-name-error" data-testid="orderer-name-error" role="alert"></p>
            </div>
            <div class="field">
              <label for="orderer-phone">연락처</label>
              <input type="text" id="orderer-phone" data-testid="orderer-phone" inputmode="numeric"
                     placeholder="010-0000-0000" autocomplete="tel" />
              <p class="error" id="orderer-phone-error" data-testid="orderer-phone-error" role="alert"></p>
            </div>
            <div class="field">
              <label for="orderer-email">이메일</label>
              <input type="email" id="orderer-email" data-testid="orderer-email"
                     placeholder="example@marketfresh.com" autocomplete="email" />
              <p class="error" id="orderer-email-error" data-testid="orderer-email-error" role="alert"></p>
            </div>
          </div>
        </section>

        <!-- 배송지 정보 -->
        <section class="order-card">
          <div class="order-card-head">
            <h2 class="order-card-title">배송지 정보</h2>
            <button type="button" class="addr-change-btn hidden" id="addr-change"
                    data-testid="addr-change">배송지 변경</button>
          </div>

          <!-- 로그인: 텍스트 표시 (기본 배송지) -->
          <div class="info-view hidden" id="delivery-view" data-testid="delivery-view">
            <div class="info-name">
              <span id="view-recipient" data-testid="view-recipient"></span>
              <span class="addr-badge" data-testid="addr-badge">기본 배송지</span>
            </div>
            <div class="info-line" id="view-address" data-testid="view-address"></div>
            <div class="info-line" id="view-phone" data-testid="view-phone"></div>
          </div>

          <!-- 비로그인 또는 배송지 변경 시: 입력 폼 -->
          <div class="info-form" id="delivery-form" data-testid="delivery-form">
            <div class="field">
              <label for="recipient">받는 사람</label>
              <input type="text" id="recipient" data-testid="order-recipient" autocomplete="name" />
              <p class="error" id="recipient-error" data-testid="recipient-error" role="alert"></p>
            </div>
            <div class="field">
              <label for="phone">연락처</label>
              <input type="text" id="phone" data-testid="order-phone" inputmode="numeric"
                     placeholder="010-0000-0000" autocomplete="tel" />
              <p class="error" id="phone-error" data-testid="phone-error" role="alert"></p>
            </div>
            <div class="field">
              <label for="address">주소</label>
              <input type="text" id="address" data-testid="order-address" autocomplete="street-address" />
              <p class="error" id="address-error" data-testid="address-error" role="alert"></p>
            </div>
          </div>

          <!-- 배송 요청사항 (로그인/비로그인 공통) -->
          <div class="field" style="margin-top:1rem">
            <label for="request">배송 요청사항 <span class="field-optional">선택</span></label>
            <input type="text" id="request" data-testid="order-request" placeholder="예: 문 앞에 놓아주세요" />
          </div>
        </section>

        <!-- 주문 상품 -->
        <section class="order-card">
          <h2 class="order-card-title">주문 상품</h2>
          <div id="order-items" data-testid="order-items"></div>
        </section>

        <!-- 결제수단 -->
        <section class="order-card">
          <h2 class="order-card-title">결제수단</h2>
          <div class="pay-methods" role="radiogroup" aria-label="결제수단">
            <label class="pay-option">
              <input type="radio" name="pay" value="card" data-testid="pay-card" checked />
              <span>신용카드</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="pay" value="bank" data-testid="pay-bank" />
              <span>무통장입금</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="pay" value="easy" data-testid="pay-easy" />
              <span>간편결제</span>
            </label>
          </div>
        </section>

        <!-- 결제 금액 -->
        <section class="order-card">
          <h2 class="order-card-title">결제 금액</h2>
          <div class="summary" data-testid="order-summary">
            <div class="line"><span>상품금액</span><span data-testid="order-subtotal" id="subtotal"></span></div>
            <div class="line"><span>상품할인</span><span class="discount-amount" data-testid="order-discount" id="discount"></span></div>
            <div class="line"><span>배송비</span><span data-testid="order-shipping" id="shipping"></span></div>
            <div class="line total"><span>최종 결제 금액</span><span data-testid="order-total" id="total"></span></div>
          </div>

          <button class="btn btn-primary place-order-btn" id="place-order" data-testid="place-order">
            결제하기
          </button>
        </section>
      </div>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script>
    let profile = null;        // 로그인 사용자 프로필 (비회원이면 null)

    function itemHTML(it) {
      const hasDiscount = it.original_price && it.original_price > it.price;
      const priceHTML = hasDiscount
        ? `<span class="oi-original">${won(it.original_price)}</span>
           <span class="oi-price">${won(it.price)}</span>`
        : `<span class="oi-price">${won(it.price)}</span>`;
      return `
        <div class="order-item" data-testid="order-item">
          <div class="ci-thumb" style="background:${it.color}"><span aria-hidden="true">${it.emoji}</span></div>
          <div class="ci-info">
            <div class="ci-name">${it.name}</div>
            <div class="ci-unit">${it.unit} · ${it.qty}개</div>
            <div class="oi-prices" data-testid="order-item-price">${priceHTML}</div>
          </div>
          <div class="ci-line">${won(it.line_total)}</div>
        </div>`;
    }

    async function load() {
      const res = await fetch("/api/checkout");
      const data = await res.json();
      document.querySelector("#loading").classList.add("hidden");

      if (data.items.length === 0) {
        document.querySelector("#empty").classList.remove("hidden");
        return;
      }

      document.querySelector("#order-body").classList.remove("hidden");
      document.querySelector("#order-items").innerHTML = data.items.map(itemHTML).join("");
      document.querySelector("#subtotal").textContent = won(data.subtotal);
      document.querySelector("#discount").textContent =
        data.discount_total > 0 ? `-${won(data.discount_total)}` : won(0);
      document.querySelector("#shipping").textContent =
        data.shipping === 0 ? "무료" : won(data.shipping);
      document.querySelector("#total").textContent = won(data.total);
    }

    async function initProfile() {
      // 로그인 상태면 프로필을 받아 '텍스트 표시' 모드로, 비회원이면 '입력 폼' 모드로.
      const res = await fetch("/api/me");
      if (res.status !== 200) return;      // 401(비회원) → 입력 폼 유지

      profile = await res.json();

      // --- 주문자 정보: 텍스트 표시 ---
      document.querySelector("#view-orderer-name").textContent = profile.name || "-";
      document.querySelector("#view-orderer-phone").textContent = profile.phone || "-";
      document.querySelector("#view-orderer-email").textContent = profile.email || "-";
      document.querySelector("#orderer-view").classList.remove("hidden");
      document.querySelector("#orderer-form").classList.add("hidden");

      // --- 배송지 정보: 텍스트 표시 + '배송지 변경' 버튼 노출 ---
      document.querySelector("#view-recipient").textContent = profile.name || "-";
      document.querySelector("#view-address").textContent = profile.address || "-";
      document.querySelector("#view-phone").textContent = profile.phone || "-";
      document.querySelector("#delivery-view").classList.remove("hidden");
      document.querySelector("#delivery-form").classList.add("hidden");
      document.querySelector("#addr-change").classList.remove("hidden");

      // 폼에도 프로필 값을 미리 채워둔다 (변경 모드로 전환 시 기본값)
      document.querySelector("#orderer-name").value = profile.name || "";
      document.querySelector("#orderer-phone").value = profile.phone || "";
      document.querySelector("#orderer-email").value = profile.email || "";
      document.querySelector("#recipient").value = profile.name || "";
      document.querySelector("#phone").value = profile.phone || "";
      document.querySelector("#address").value = profile.address || "";
    }

    // '배송지 변경' → 텍스트 표시를 감추고 입력 폼으로 전환
    document.querySelector("#addr-change").addEventListener("click", () => {
      document.querySelector("#delivery-view").classList.add("hidden");
      document.querySelector("#delivery-form").classList.remove("hidden");
      document.querySelector("#addr-change").classList.add("hidden");
    });

    function isFormMode(formId) {
      // 해당 섹션이 입력 폼 모드인지 (hidden 이 없으면 폼 모드)
      return !document.querySelector(formId).classList.contains("hidden");
    }

    // 서버 검증 필드명 → 화면의 에러 표시 요소
    const ERROR_FIELD_MAP = {
      orderer_name: "#orderer-name-error",
      orderer_phone: "#orderer-phone-error",
      orderer_email: "#orderer-email-error",
      recipient_name: "#recipient-error",
      phone: "#phone-error",
      address: "#address-error",
    };

    function clearErrors() {
      for (const sel of Object.values(ERROR_FIELD_MAP)) {
        document.querySelector(sel).textContent = "";
      }
    }

    function buildOrderBody() {
      // 폼이 열려 있으면 입력값을, 텍스트 표시 모드면 프로필 값을 담는다
      const ordererFromForm = isFormMode("#orderer-form");
      const deliveryFromForm = isFormMode("#delivery-form");
      const val = (sel) => document.querySelector(sel).value.trim();

      return {
        orderer_name: ordererFromForm ? val("#orderer-name") : (profile?.name || ""),
        orderer_phone: ordererFromForm ? val("#orderer-phone") : (profile?.phone || ""),
        orderer_email: ordererFromForm ? val("#orderer-email") : (profile?.email || ""),
        recipient_name: deliveryFromForm ? val("#recipient") : (profile?.name || ""),
        phone: deliveryFromForm ? val("#phone") : (profile?.phone || ""),
        address: deliveryFromForm ? val("#address") : (profile?.address || ""),
        delivery_request: val("#request"),
        payment_method: document.querySelector('input[name="pay"]:checked').value,
      };
    }

    function renderValidationErrors(detail) {
      // FastAPI 422 응답의 detail[] 을 필드별 에러 문구로 표시
      // detail 예: [{ "type": "string_too_short", "loc": ["body", "orderer_name"], ... }]
      if (!Array.isArray(detail)) return;

      for (const err of detail) {
        const field = Array.isArray(err.loc) ? err.loc[err.loc.length - 1] : null;
        const target = ERROR_FIELD_MAP[field];
        if (!target) continue;

        const isFormat = String(err.type || "").includes("pattern");
        document.querySelector(target).textContent = isFormat
          ? "이메일 형식이 올바르지 않습니다."
          : "필수 입력 항목입니다.";
      }
    }

    async function placeOrder() {
      // 검증은 서버에 위임한다. 클릭하면 항상 주문 API 를 호출하고,
      // 필수값이 모두 충족되면 201(생성), 하나라도 어긋나면 422(에러)를 받아 화면에 반영한다.
      clearErrors();

      const res = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(buildOrderBody()),
      });

      if (res.status === 201) {
        const order = await res.json();
        window.location.href = `/order/complete/${order.order_id}`;
        return;
      }

      const body = await res.json().catch(() => ({}));

      if (res.status === 422) {
        renderValidationErrors(body.detail);      // 필드별 에러 문구 노출
        toast("입력값을 확인해주세요.", "err");
      } else if (res.status === 409) {
        toast(body.detail || "장바구니가 비어 있습니다.", "err");
      } else {
        toast("주문에 실패했습니다.", "err");
      }
    }

    document.querySelector("#place-order").addEventListener("click", placeOrder);

    initHeader();
    load();
    initProfile();
  </script>
</body>
</html>
