<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>약관 · 마켓프레시</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="policy-page">
    <a class="logo policy-logo" href="/" data-testid="logo">마켓프레시</a>

    <h1 class="policy-title" id="policy-title" data-testid="policy-title"></h1>
    <p class="policy-meta" id="policy-meta" data-testid="policy-meta"></p>

    <div class="policy-body" id="policy-body" data-testid="policy-body"></div>
  </main>

  <script>
    // URL: /policy/{key}  (privacy | guide | terms)
    const key = location.pathname.split("/").filter(Boolean)[1];

    // 데모용 더미 약관 텍스트
    const POLICIES = {
      privacy: {
        title: "개인정보처리방침",
        updated: "2026-07-01",
        sections: [
          ["제1조 (총칙)",
           "주식회사 마켓프레시(이하 '회사')는 이용자의 개인정보를 중요시하며, 「개인정보 보호법」 등 관련 법령을 준수하고 있습니다. 본 방침은 회사가 제공하는 서비스를 이용하는 이용자의 개인정보가 어떤 목적으로 수집·이용되며, 어떤 방식으로 보호되는지를 안내합니다."],
          ["제2조 (수집하는 개인정보 항목)",
           "회사는 회원가입, 주문 및 배송, 고객 문의 처리를 위해 아래와 같은 정보를 수집합니다.\n\n· 필수항목: 아이디, 비밀번호, 이름, 연락처, 이메일, 주소\n· 주문 시: 수령인 정보, 배송지, 결제수단\n· 자동 수집: 접속 기록, 쿠키, 서비스 이용 기록"],
          ["제3조 (개인정보의 수집 및 이용 목적)",
           "수집된 정보는 다음 목적으로만 이용됩니다.\n\n· 회원 식별 및 본인 확인\n· 상품 주문·배송 및 결제 처리\n· 고객 문의 응대 및 공지사항 전달\n· 서비스 개선을 위한 통계 분석"],
          ["제4조 (개인정보의 보유 및 이용 기간)",
           "원칙적으로 개인정보 수집·이용 목적이 달성되면 지체 없이 파기합니다. 다만 관계 법령에 따라 아래 정보는 명시된 기간 동안 보관합니다.\n\n· 계약 또는 청약철회 기록: 5년\n· 대금 결제 및 재화 공급 기록: 5년\n· 소비자 불만 또는 분쟁 처리 기록: 3년\n· 접속에 관한 기록: 3개월"],
          ["제5조 (개인정보의 제3자 제공)",
           "회사는 이용자의 개인정보를 제2조에서 고지한 범위를 넘어 이용하거나 제3자에게 제공하지 않습니다. 다만 배송을 위해 배송업체에 수령인 정보를 전달하는 경우, 법령에 근거한 요청이 있는 경우는 예외로 합니다."],
          ["제6조 (이용자의 권리)",
           "이용자는 언제든지 마이페이지를 통해 자신의 개인정보를 조회·수정할 수 있으며, 회원 탈퇴를 요청할 수 있습니다. 개인정보 열람·정정·삭제 요청은 고객센터로 접수해 주시기 바랍니다."],
          ["제7조 (개인정보 보호책임자)",
           "· 성명: 김신선\n· 직책: 개인정보 보호책임자\n· 연락처: 1600-1234 / help@marketfresh.test"],
        ],
      },
      guide: {
        title: "이용안내",
        updated: "2026-07-01",
        sections: [
          ["주문 안내",
           "· 밤 11시 이전 주문 시 다음 날 새벽 배송으로 도착합니다.\n· 주문은 로그인 후는 물론 비회원으로도 가능합니다.\n· 주문 완료 후에는 주문내역 메뉴에서 진행 상태를 확인할 수 있습니다."],
          ["배송 안내",
           "· 배송비는 3,000원이며, 상품 금액 합계가 40,000원 이상이면 무료입니다.\n· 배송 지역은 수도권 및 일부 광역시에 한합니다.\n· 신선식품 특성상 배송 시작 이후에는 배송지 변경이 어렵습니다."],
          ["결제 안내",
           "· 신용카드, 무통장입금, 간편결제를 지원합니다.\n· 무통장입금은 주문 후 24시간 이내 입금되지 않으면 자동 취소됩니다.\n· 결제 금액은 주문서의 '최종 결제 금액'을 기준으로 청구됩니다."],
          ["교환 및 환불 안내",
           "· 상품 수령 후 7일 이내 교환·환불 신청이 가능합니다.\n· 다만 신선식품은 개봉하거나 훼손된 경우 교환·환불이 제한될 수 있습니다.\n· 상품 하자로 인한 교환·환불은 배송비를 회사가 부담합니다."],
          ["회원 안내",
           "· 아이디는 영문·숫자·특수문자 4~10자로 설정합니다.\n· 비밀번호는 영문·숫자·특수문자 8~16자이며 특수문자를 반드시 포함해야 합니다.\n· 아이디, 이메일, 연락처는 중복해서 가입할 수 없습니다."],
        ],
      },
      terms: {
        title: "서비스 이용약관",
        updated: "2026-07-01",
        sections: [
          ["제1조 (목적)",
           "본 약관은 주식회사 마켓프레시(이하 '회사')가 제공하는 온라인 식료품 판매 서비스(이하 '서비스')의 이용과 관련하여 회사와 이용자의 권리·의무 및 책임사항을 규정함을 목적으로 합니다."],
          ["제2조 (용어의 정의)",
           "· '서비스'란 회사가 운영하는 웹사이트를 통해 제공하는 상품 판매 및 배송 서비스를 말합니다.\n· '이용자'란 본 약관에 따라 서비스를 이용하는 회원 및 비회원을 말합니다.\n· '회원'이란 회사에 개인정보를 제공하여 회원등록을 한 자를 말합니다."],
          ["제3조 (약관의 효력 및 변경)",
           "본 약관은 서비스 화면에 게시함으로써 효력이 발생합니다. 회사는 관련 법령을 위배하지 않는 범위에서 약관을 변경할 수 있으며, 변경 시 적용일자와 사유를 명시하여 최소 7일 전부터 공지합니다."],
          ["제4조 (서비스의 제공 및 중단)",
           "회사는 연중무휴 24시간 서비스를 제공함을 원칙으로 합니다. 다만 시스템 점검, 설비 교체, 천재지변 등 불가피한 사유가 있는 경우 서비스 제공을 일시적으로 중단할 수 있습니다."],
          ["제5조 (회원의 의무)",
           "이용자는 다음 행위를 하여서는 안 됩니다.\n\n· 타인의 정보를 도용하여 가입하거나 서비스를 이용하는 행위\n· 회사가 게시한 정보를 무단으로 변경하는 행위\n· 서비스 운영을 고의로 방해하는 행위"],
          ["제6조 (주문 및 계약의 성립)",
           "이용자의 주문에 대해 회사가 승낙의 의사표시를 한 시점에 구매계약이 성립합니다. 재고 부족, 결제 오류 등의 사유가 있는 경우 회사는 주문을 취소할 수 있습니다."],
          ["제7조 (면책조항)",
           "회사는 천재지변 또는 이에 준하는 불가항력으로 인해 서비스를 제공할 수 없는 경우 책임이 면제됩니다. 또한 이용자의 귀책사유로 인한 서비스 이용 장애에 대해서는 책임을 지지 않습니다."],
          ["부칙",
           "본 약관은 2026년 7월 1일부터 시행합니다."],
        ],
      },
    };

    function render() {
      const policy = POLICIES[key];

      if (!policy) {
        document.querySelector("#policy-title").textContent = "페이지를 찾을 수 없습니다";
        document.querySelector("#policy-body").innerHTML =
          `<p>요청하신 문서가 존재하지 않습니다. <a href="/">홈으로 이동</a></p>`;
        return;
      }

      document.title = `${policy.title} · 마켓프레시`;
      document.querySelector("#policy-title").textContent = policy.title;
      document.querySelector("#policy-meta").textContent = `시행일자 ${policy.updated}`;
      document.querySelector("#policy-body").innerHTML = policy.sections
        .map(
          ([heading, text]) => `
            <section class="policy-article">
              <h2>${heading}</h2>
              <p>${text.replace(/\n/g, "<br />")}</p>
            </section>`
        )
        .join("");
    }

    render();
  </script>
</body>
</html>
